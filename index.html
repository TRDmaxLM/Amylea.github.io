<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 01 - Personal Webpage</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      background: rgb(239, 128, 63);
      width: 450px;
      padding: 450px; /* Adjust padding if needed */
      text-align: center;
      border-radius: 12px;
      color: white;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Welcome to My Webpage</h1>
    <p>This is my personal page hosted on GitHub Pages!</p>
  </div>
</body>
</html>
